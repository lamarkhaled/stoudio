  <style>
    :root {
      --brand: #18181B;
      --brand-soft: rgba(24, 24, 27, 0.08);
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Dynamic Brand Utilities */
    .bg-brand { background-color: var(--brand) !important; }
    .text-brand { color: var(--brand) !important; }
    .border-brand { border-color: var(--brand) !important; }
    .ring-brand:focus {
      outline: none;
      border-color: var(--brand) !important;
      box-shadow: 0 0 0 3px var(--brand-soft);
    }

    /* Apple Glassmorphism */
    .glass-nav {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    .dark .glass-nav {
      background: rgba(15, 15, 18, 0.78);
    }

    /* Subtle Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(113, 113, 122, 0.28); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(113, 113, 122, 0.45); }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fadeUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes pinPulse {
      0% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(24, 24, 27, 0.45); }
      50% { transform: translate(-50%, -50%) scale(1.22); box-shadow: 0 0 0 10px rgba(24, 24, 27, 0); }
      100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(24, 24, 27, 0); }
    }
    .pin-highlight { animation: pinPulse 0.85s ease-in-out 2; z-index: 30 !important; }

    /* Drag & Drop Column Highlight */
    .kanban-col-over {
      background-color: rgba(113, 113, 122, 0.08) !important;
      border-color: var(--brand) !important;
    }
  </style>
</head>

    // =========================================================================
    // 2. UTILITIES (SAFE STORAGE, HASHING, COMPRESSION, CLIPBOARD, ESCAPING)
    // =========================================================================
    const SafeStorage = {
      mem: {},
      get(key) {
        try { return window.localStorage.getItem(key); } catch { return this.mem[key] ?? null; }
      },
      set(key, val) {
        try { window.localStorage.setItem(key, val); } catch { this.mem[key] = val; }
      },
      remove(key) {
        try { window.localStorage.removeItem(key); } catch { delete this.mem[key]; }
      }
    };

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function genId(prefix = "id") {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
    }

    function generateActivationCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const part = (n) => Array.from({ length: n }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
      return `STUDIO-${part(4)}-${part(4)}`;
    }

    async function hashPassword(str) {
      try {
        if (window.crypto && window.crypto.subtle) {
          const data = new TextEncoder().encode("studio_salt_v2::" + str);
          const buf = await window.crypto.subtle.digest("SHA-256", data);
          return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
        }
      } catch (e) {}
      // Deterministic fallback hash for non-HTTPS local preview contexts
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
      }
      return "fb_" + (h >>> 0).toString(16);
    }

    function formatDate(val) {
      if (!val) return "غير محدد";
      try {
        const d = typeof val === "number" ? new Date(val) : new Date(val);
        if (isNaN(d.getTime())) return String(val);
        return d.toLocaleDateString("ar-SA", { year: "numeric", month: "short", day: "numeric" });
      } catch {
        return String(val);
      }
    }

    function copyText(text, successMsg = "تم النسخ بنجاح") {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) {
          showToast(successMsg, "success");
          return;
        }
      } catch (e) {}
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast(successMsg, "success"))
          .catch(() => showToast("تعذر النسخ تلقائياً", "error"));
      } else {
        showToast("تعذر النسخ تلقائياً", "error");
      }
    }

    function compressImageFile(file, maxWidth = 1200, quality = 0.75) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith("image/")) {
          reject(new Error("يرجى اختيار ملف صورة صالح"));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("تعذر قراءة الملف"));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("صيغة الصورة غير مدعومة"));
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function hexToRgba(hex, alpha = 0.14) {
      const clean = (hex || "#18181B").replace("#", "");
      if (clean.length !== 6) return `rgba(24,24,27,${alpha})`;
      const r = parseInt(clean.slice(0, 2), 16);
      const g = parseInt(clean.slice(2, 4), 16);
      const b = parseInt(clean.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function applyBrandColor(hex) {
      const valid = /^#[0-9A-Fa-f]{6}$/.test(hex) ? hex : "#18181B";
      document.documentElement.style.setProperty("--brand", valid);
      document.documentElement.style.setProperty("--brand-soft", hexToRgba(valid, 0.15));
    }

    function applyTheme(theme) {
      const mode = theme === "dark" ? "dark" : "light";
      state.theme = mode;
      document.documentElement.classList.toggle("dark", mode === "dark");
      document.documentElement.classList.toggle("light", mode === "light");
      SafeStorage.set("mds_theme", mode);
    }

    // =========================================================================
    // 3. TOASTS & CUSTOM MODALS (NEVER USE alert() OR confirm())
    // =========================================================================
    function showToast(message, type = "info") {
      const root = document.getElementById("toast-root");
      if (!root) return;
      const el = document.createElement("div");
      const badgeClass =
        type === "success" ? "bg-emerald-500" :
        type === "error"   ? "bg-red-500" : "bg-zinc-900 dark:bg-white";
      el.className = "pointer-events-auto animate-fade-up flex items-center gap-3 px-4 py-3 rounded-2xl bg-white/95 dark:bg-[#18181B]/95 border border-black/10 dark:border-white/10 shadow-apple-lg text-sm font-medium text-zinc-900 dark:text-zinc-100 backdrop-blur-md";
      el.innerHTML = `<span class="w-2 h-2 rounded-full shrink-0 ${badgeClass}"></span><span class="leading-snug">${escapeHtml(message)}</span>`;
      root.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        el.style.transform = "translateY(6px)";
        el.style.transition = "all 0.2s ease";
        setTimeout(() => el.remove(), 220);
      }, 3200);
    }

    function openModal(htmlContent, maxWidthClass = "max-w-lg") {
      const root = document.getElementById("modal-root");
      root.innerHTML = `
        <div class="w-full ${maxWidthClass} bg-white dark:bg-[#141416] border border-black/10 dark:border-white/10 rounded-3xl shadow-apple-lg overflow-hidden animate-fade-up max-h-[90vh] overflow-y-auto">
          ${htmlContent}
        </div>
      `;
      root.classList.remove("hidden");
      root.classList.add("flex");
    }

    function closeModal() {
      const root = document.getElementById("modal-root");
      root.classList.add("hidden");
      root.classList.remove("flex");
      root.innerHTML = "";
    }

    function openConfirmModal({ title, message, confirmLabel = "تأكيد", danger = false, onConfirm }) {
      openModal(`
        <div class="p-6">
          <h3 class="text-lg font-semibold mb-2">${escapeHtml(title)}</h3>
          <p class="text-sm text-zinc-500 dark:text-zinc-400 leading-relaxed mb-6">${escapeHtml(message)}</p>
          <div class="flex items-center justify-end gap-2.5">
            <button type="button" data-action="close-modal" class="px-4 py-2.5 rounded-xl text-sm font-medium text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">إلغاء</button>
            <button type="button" id="confirm-modal-ok" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-white transition ${danger ? "bg-red-600 hover:bg-red-700" : "bg-brand hover:opacity-90"}">${escapeHtml(confirmLabel)}</button>
          </div>
        </div>
      `, "max-w-md");
      document.getElementById("confirm-modal-ok").addEventListener("click", async () => {
        closeModal();
        if (typeof onConfirm === "function") await onConfirm();
      });
    }

    // =========================================================================
    // 4. APPLICATION STATE
    // =========================================================================
    const state = {
      mode: "local", // "firebase" | "local"
      theme: SafeStorage.get("mds_theme") || "light",
      view: "auth", // "auth" | "pending" | "board" | "project" | "settings" | "admin" | "client"
      authTab: "login", // "login" | "signup"
      currentUser: null,
      users: [],
      projects: [],
      codes: [],
      activeProjectId: null,
      activeProjectTab: "moodboard", // "moodboard" | "checklist" | "vault" | "drafts"
      activeDraftIndex: 0,
      clientProjectId: null,
      previewingClient: false,
      pendingPin: null, // { x, y }
      highlightedCommentId: null,
      draggedProjectId: null,
      // Focus Timer State
      timer: {
        expanded: false,
        presetMinutes: 25,
        secondsLeft: 25 * 60,
        running: false,
        intervalId: null
      }
    };

    // =========================================================================
    // 5. DUAL-MODE PERSISTENCE ENGINE (FIREBASE v11 + LOCAL CLOUD SIMULATION)
    // =========================================================================
    const LOCAL_DB_KEY = "mds_local_cloud_v2";
    const SESSION_USER_KEY = "mds_session_uid";

    const appId = typeof window.__app_id !== "undefined" ? window.__app_id : "minimal-design-studio";
    let firebaseConfig = DEFAULT_FIREBASE_CONFIG;
    if (typeof window.__firebase_config !== "undefined" && window.__firebase_config) {
      try {
        firebaseConfig = typeof window.__firebase_config === "string"
          ? JSON.parse(window.__firebase_config)
          : window.__firebase_config;
      } catch (e) {
        console.warn("Could not parse __firebase_config:", e);
      }
    }

    let fbAuth = null;
    let fbDb = null;

    const getCol = (name) => collection(fbDb, "artifacts", appId, "public", "data", name);
    const getDocRef = (name, id) => doc(fbDb, "artifacts", appId, "public", "data", name, id);

    function loadLocalDb() {
      try {
        const raw = SafeStorage.get(LOCAL_DB_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state.users = Array.isArray(parsed.users) ? parsed.users : [];
          state.projects = Array.isArray(parsed.projects) ? parsed.projects : [];
          state.codes = Array.isArray(parsed.codes) ? parsed.codes : [];
          return;
        }
      } catch (e) {}
      state.users = [];
      state.projects = [];
      state.codes = [];
    }

    function persistLocalDb() {
      if (state.mode !== "local") return;
      try {
        SafeStorage.set(LOCAL_DB_KEY, JSON.stringify({
          users: state.users,
          projects: state.projects,
          codes: state.codes
        }));
      } catch (e) {
        showToast("مساحة التخزين المحلي ممتلئة، جرّب صور أصغر", "error");
      }
    }

    const Store = {
      async init() {
        const hasKeys = Boolean(firebaseConfig && firebaseConfig.apiKey && firebaseConfig.projectId);
        if (hasKeys) {
          try {
            const app = initializeApp(firebaseConfig);
            fbAuth = getAuth(app);
            fbDb = getFirestore(app);

            // RULE 3: Authenticate FIRST before any Firestore queries
            if (typeof window.__initial_auth_token !== "undefined" && window.__initial_auth_token) {
              await signInWithCustomToken(fbAuth, window.__initial_auth_token);
            } else if (!fbAuth.currentUser) {
              await signInAnonymously(fbAuth);
            }

            state.mode = "firebase";
            await this.startRealtimeListeners();
            return;
          } catch (err) {
            console.warn("Firebase unavailable, switching to Local Cloud Simulation:", err);
          }
        }
        state.mode = "local";
        loadLocalDb();
        this.restoreSession();
      },

      startRealtimeListeners() {
        return new Promise((resolve) => {
          let loadedFlags = { users: false, projects: false, codes: false };
          const checkDone = () => {
            if (loadedFlags.users && loadedFlags.projects && loadedFlags.codes) {
              this.restoreSession();
              resolve();
            }
          };

          onSnapshot(getCol("studio_users"), (snap) => {
            state.users = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            if (state.currentUser) {
              const fresh = state.users.find((u) => u.id === state.currentUser.id);
              if (fresh) {
                state.currentUser = fresh;
                if (!fresh.isActive && !["auth", "client"].includes(state.view)) {
                  state.view = "pending";
                } else if (fresh.isActive && state.view === "pending") {
                  state.view = "board";
                  ensureSampleProjects(fresh);
                }
              }
            }
            if (!loadedFlags.users) { loadedFlags.users = true; checkDone(); }
            render();
          }, (err) => {
            console.error("Users listener error:", err);
            if (!loadedFlags.users) { loadedFlags.users = true; checkDone(); }
          });

          onSnapshot(getCol("studio_projects"), (snap) => {
            state.projects = snap.docs
              .map((d) => ({ id: d.id, ...d.data() }))
              .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            if (!loadedFlags.projects) { loadedFlags.projects = true; checkDone(); }
            render();
          }, (err) => {
            console.error("Projects listener error:", err);
            if (!loadedFlags.projects) { loadedFlags.projects = true; checkDone(); }
          });

          onSnapshot(getCol("studio_codes"), (snap) => {
            state.codes = snap.docs
              .map((d) => ({ id: d.id, ...d.data() }))
              .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            if (!loadedFlags.codes) { loadedFlags.codes = true; checkDone(); }
            render();
          }, (err) => {
            console.error("Codes listener error:", err);
            if (!loadedFlags.codes) { loadedFlags.codes = true; checkDone(); }
          });
        });
      },

      restoreSession() {
        const savedUid = SafeStorage.get(SESSION_USER_KEY);
        if (savedUid) {
          const found = state.users.find((u) => u.id === savedUid);
          if (found) {
            state.currentUser = found;
            applyBrandColor(found.brandColor || "#18181B");
            if (state.view !== "client") {
              state.view = found.isActive ? "board" : "pending";
            }
          }
        }
      },

      async setUser(id, data) {
        if (state.mode === "firebase") {
          await setDoc(getDocRef("studio_users", id), data);
        } else {
          const idx = state.users.findIndex((u) => u.id === id);
          const rec = { id, ...data };
          if (idx >= 0) state.users[idx] = rec;
          else state.users.push(rec);
          if (state.currentUser?.id === id) state.currentUser = rec;
          persistLocalDb();
        }
      },

      async updateUser(id, updates) {
        if (state.mode === "firebase") {
          await updateDoc(getDocRef("studio_users", id), updates);
        } else {
          const idx = state.users.findIndex((u) => u.id === id);
          if (idx >= 0) {
            state.users[idx] = { ...state.users[idx], ...updates };
            if (state.currentUser?.id === id) state.currentUser = state.users[idx];
            persistLocalDb();
          }
        }
      },

      async addProject(data) {
        if (state.mode === "firebase") {
          const ref = await addDoc(getCol("studio_projects"), data);
          return ref.id;
        } else {
          const id = genId("prj");
          state.projects.unshift({ id, ...data });
          persistLocalDb();
          return id;
        }
      },

      async updateProject(id, updates) {
        if (state.mode === "firebase") {
          await updateDoc(getDocRef("studio_projects", id), updates);
        } else {
          const idx = state.projects.findIndex((p) => p.id === id);
          if (idx >= 0) {
            state.projects[idx] = { ...state.projects[idx], ...updates };
            persistLocalDb();
          }
        }
      },

      async deleteProject(id) {
        if (state.mode === "firebase") {
          await deleteDoc(getDocRef("studio_projects", id));
        } else {
          state.projects = state.projects.filter((p) => p.id !== id);
          persistLocalDb();
        }
      },

      async addCode(data) {
        if (state.mode === "firebase") {
          const ref = await addDoc(getCol("studio_codes"), data);
          return ref.id;
        } else {
          const id = genId("cod");
          state.codes.unshift({ id, ...data });
          persistLocalDb();
          return id;
        }
      },

      async updateCode(id, updates) {
        if (state.mode === "firebase") {
          await updateDoc(getDocRef("studio_codes", id), updates);
        } else {
          const idx = state.codes.findIndex((c) => c.id === id);
          if (idx >= 0) {
            state.codes[idx] = { ...state.codes[idx], ...updates };
            persistLocalDb();
          }
        }
      },

      async deleteCode(id) {
        if (state.mode === "firebase") {
          await deleteDoc(getDocRef("studio_codes", id));
        } else {
          state.codes = state.codes.filter((c) => c.id !== id);
          persistLocalDb();
        }
      }
    };

    // =========================================================================
    // 7. ROUTING & CLIENT PORTAL LINK HELPERS
    // =========================================================================
    function getClientShareUrl(projectId) {
      const base = window.location.href.split("#")[0];
      return `${base}#client=${encodeURIComponent(projectId)}`;
    }

    function checkHashRoute() {
      const hash = window.location.hash || "";
      const match = hash.match(/^#client=([^&]+)/);
      if (match && match[1]) {
        state.clientProjectId = decodeURIComponent(match[1]);
        state.previewingClient = false;
        state.view = "client";
        state.activeDraftIndex = 0;
        state.pendingPin = null;
        render();
        return true;
      }
      return false;
    }

    window.addEventListener("hashchange", () => {
      if (!checkHashRoute()) {
        if (state.currentUser) {
          state.view = state.currentUser.isActive ? "board" : "pending";
        } else {
          state.view = "auth";
        }
        render();
      }
    });

    // =========================================================================
    // 8. FOCUS TIMER CONTROLLER (INDEPENDENT ROOT)
    // =========================================================================
    function formatClock(totalSec) {
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function getTodaySessions() {
      if (!state.currentUser) return 0;
      const today = new Date().toISOString().slice(0, 10);
      return state.currentUser.focusDate === today ? (state.currentUser.focusSessionsToday || 0) : 0;
    }

    async function completeFocusSession() {
      state.timer.running = false;
      clearInterval(state.timer.intervalId);
      state.timer.intervalId = null;
      state.timer.secondsLeft = state.timer.presetMinutes * 60;

      if (state.currentUser) {
        const today = new Date().toISOString().slice(0, 10);
        const nextCount = state.currentUser.focusDate === today
          ? (state.currentUser.focusSessionsToday || 0) + 1
          : 1;
        await Store.updateUser(state.currentUser.id, {
          focusSessionsToday: nextCount,
          focusDate: today
        });
      }
      showToast("أحسنت! أتممت جلسة تركيز إبداعي بنجاح", "success");
      renderFocusTimer();
    }

    function toggleFocusTimer() {
      if (state.timer.running) {
        state.timer.running = false;
        clearInterval(state.timer.intervalId);
        state.timer.intervalId = null;
      } else {
        state.timer.running = true;
        state.timer.intervalId = setInterval(() => {
          if (state.timer.secondsLeft > 1) {
            state.timer.secondsLeft -= 1;
            renderFocusTimer();
          } else {
            completeFocusSession();
          }
        }, 1000);
      }
      renderFocusTimer();
    }

    function setFocusPreset(mins) {
      state.timer.running = false;
      clearInterval(state.timer.intervalId);
      state.timer.intervalId = null;
      state.timer.presetMinutes = mins;
      state.timer.secondsLeft = mins * 60;
      renderFocusTimer();
    }

    function renderFocusTimer() {
      const root = document.getElementById("timer-root");
      if (!root) return;
      // Only show for active logged-in designers outside Client Portal
      if (!state.currentUser || !state.currentUser.isActive || state.view === "client") {
        root.innerHTML = "";
        return;
      }

      const total = state.timer.presetMinutes * 60;
      const progress = Math.max(0, Math.min(1, (total - state.timer.secondsLeft) / total));
      const radius = 18;
      const circumference = 2 * Math.PI * radius;
      const dashOffset = circumference * (1 - progress);
      const sessions = getTodaySessions();

      if (!state.timer.expanded) {
        root.innerHTML = `
          <div class="fixed bottom-5 left-5 z-40">
            <button data-action="timer-toggle-expand" class="flex items-center gap-2.5 pl-4 pr-3 py-2.5 rounded-full bg-white/90 dark:bg-[#18181B]/90 backdrop-blur-xl border border-black/10 dark:border-white/10 shadow-apple-lg hover:scale-[1.02] transition">
              <span class="relative flex items-center justify-center w-6 h-6">
                <svg class="w-6 h-6 -rotate-90" viewBox="0 0 44 44">
                  <circle cx="22" cy="22" r="${radius}" fill="none" stroke="currentColor" stroke-width="3.5" class="text-zinc-200 dark:text-zinc-800"></circle>
                  <circle cx="22" cy="22" r="${radius}" fill="none" stroke="var(--brand)" stroke-width="3.5" stroke-dasharray="${circumference}" stroke-dashoffset="${dashOffset}" stroke-linecap="round"></circle>
                </svg>
                <span class="absolute w-1.5 h-1.5 rounded-full ${state.timer.running ? "bg-emerald-500 animate-pulse" : "bg-zinc-400"}"></span>
              </span>
              <span class="text-xs font-mono font-semibold tracking-wider text-zinc-900 dark:text-zinc-100">${formatClock(state.timer.secondsLeft)}</span>
              <span class="text-[11px] text-zinc-400 hidden sm:inline">تركيز</span>
            </button>
          </div>
        `;
        return;
      }

      root.innerHTML = `
        <div class="fixed bottom-5 left-5 z-40 w-72 rounded-3xl bg-white/95 dark:bg-[#161619]/95 backdrop-blur-xl border border-black/10 dark:border-white/10 shadow-apple-lg p-5 animate-fade-up">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2 text-xs font-semibold text-zinc-700 dark:text-zinc-200">
              ${Icons.clock}
              <span>مؤقت التركيز الإبداعي</span>
            </div>
            <button data-action="timer-toggle-expand" class="p-1 rounded-lg text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition" title="تصغير">${Icons.x}</button>
          </div>

          <div class="flex items-center justify-center gap-2 mb-4">
            <button data-action="timer-preset" data-mins="25" class="flex-1 py-1.5 rounded-xl text-xs font-medium transition ${state.timer.presetMinutes === 25 ? "bg-brand text-white" : "bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300"}">25 دقيقة</button>
            <button data-action="timer-preset" data-mins="50" class="flex-1 py-1.5 rounded-xl text-xs font-medium transition ${state.timer.presetMinutes === 50 ? "bg-brand text-white" : "bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300"}">50 دقيقة</button>
          </div>

          <div class="flex flex-col items-center justify-center py-2">
            <div class="relative w-28 h-28 flex items-center justify-center">
              <svg class="w-28 h-28 -rotate-90" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="4" class="text-zinc-100 dark:text-zinc-800"></circle>
                <circle cx="50" cy="50" r="42" fill="none" stroke="var(--brand)" stroke-width="4" stroke-dasharray="${2 * Math.PI * 42}" stroke-dashoffset="${2 * Math.PI * 42 * (1 - progress)}" stroke-linecap="round"></circle>
              </svg>
              <span class="absolute text-2xl font-mono font-semibold tracking-wider">${formatClock(state.timer.secondsLeft)}</span>
            </div>
          </div>

          <div class="flex items-center justify-center gap-2.5 mt-3 mb-4">
            <button data-action="timer-play-pause" class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-2xl bg-brand text-white text-xs font-semibold hover:opacity-90 transition">
              ${state.timer.running ? Icons.pause : Icons.play}
              <span>${state.timer.running ? "إيقاف مؤقت" : "بدء التركيز"}</span>
            </button>
            <button data-action="timer-reset" class="p-2.5 rounded-2xl border border-black/10 dark:border-white/10 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition" title="إعادة ضبط">
              ${Icons.reset}
            </button>
          </div>

          <div class="flex items-center justify-between pt-3 border-t border-black/5 dark:border-white/10 text-[11px] text-zinc-500 dark:text-zinc-400">
            <span>إنجاز اليوم</span>
            <span class="font-semibold text-zinc-900 dark:text-zinc-100">${sessions} جلسات مكتملة</span>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 9. VIEW RENDERERS
    // =========================================================================
    function render() {
      const app = document.getElementById("app");
      if (!app) return;

      if (state.view === "client") {
        app.innerHTML = renderClientPortalView();
        renderFocusTimer();
        return;
      }

      if (!state.currentUser || state.view === "auth") {
        applyBrandColor("#18181B");
        app.innerHTML = renderAuthView();
        renderFocusTimer();
        return;
      }

      if (!state.currentUser.isActive || state.view === "pending") {
        app.innerHTML = renderPendingGateView();
        renderFocusTimer();
        return;
      }

      applyBrandColor(state.currentUser.brandColor || "#18181B");

      app.innerHTML = `
        ${renderNavbar()}
        <main class="flex-1 w-full max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
          ${state.view === "board"    ? renderKanbanView() : ""}
          ${state.view === "project"  ? renderProjectWorkspaceView() : ""}
          ${state.view === "settings" ? renderSettingsView() : ""}
          ${state.view === "admin"    ? renderAdminView() : ""}
        </main>
      `;

      renderFocusTimer();
    }

      const myProjects = state.projects.filter((p) => p.ownerId === state.currentUser.id);

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 items-start">
            ${STAGES.map((stage) => {
              const items = myProjects.filter((p) => (p.stage || "pending") === stage.id);
              return `
                <section data-drop-stage="${stage.id}" class="kanban-col rounded-3xl bg-white/60 dark:bg-[#141416]/70 border border-black/[0.06] dark:border-white/[0.08] p-3.5 min-h-[340px] transition-colors">
                  <div class="flex items-center justify-between px-1.5 pb-3 mb-3 border-b border-black/[0.05] dark:border-white/[0.06]">
                    <div class="flex items-center gap-2">
                      <span class="w-2 h-2 rounded-full ${stage.dot}"></span>

              <span class="absolute top-2.5 right-2.5 px-2.5 py-1 rounded-full bg-emerald-500/95 text-white text-[10px] font-semibold backdrop-blur-md">معتمد رسمياً</span>

          </div>
        </article>
      `;
    }

              `).join("")}

                    <button data-action="del-mb-color" data-id="${c.id}" class="p-2 rounded-xl text-zinc-400 hover:text-red-600 transition">${Icons.trash}</button>

          <div class="bg-white dark:bg-[#141416] border border-black/[0.07] dark:border-white/10 rounded-3xl p-5 shadow-apple-sm flex flex-col">

            <div class="space-y-2.5 flex-1 mb-4">
              ${(mb.fonts || []).length === 0 ? `<p class="text-xs text-zinc-400 py-6 text-center">لم تُضف خطوط بعد</p>` : (mb.fonts || []).map((f) => `
                <div class="flex items-center justify-between gap-2 p-3 rounded-2xl bg-zinc-50 dark:bg-zinc-900/70 border border-black/5 dark:border-white/5">
                  <div class="min-w-0">
                    <div class="text-sm font-semibold truncate">${escapeHtml(f.name)}</div>
                    ${f.note ? `<div class="text-[11px] text-zinc-500 truncate mt-0.5">${escapeHtml(f.note)}</div>` : ""}
                  </div>
                  <button data-action="del-mb-font" data-id="${f.id}" class="p-2 rounded-xl text-zinc-400 hover:text-red-600 transition shrink-0">${Icons.trash}</button>
                </div>
              `).join("")}
            </div>
            <form id="add-mb-font-form" class="space-y-2 pt-3 border-t border-black/5 dark:border-white/10">
              <input name="name" type="text" required placeholder="اسم الخط (مثال: IBM Plex Arabic)" class="w-full px-3 py-2 rounded-xl border border-black/10 dark:border-white/10 bg-zinc-50 dark:bg-zinc-900 text-xs ring-brand" />
              <div class="flex gap-2">
                <input name="note" type="text" placeholder="الاستخدام (عناوين / نصوص)" class="flex-1 px-3 py-2 rounded-xl border border-black/10 dark:border-white/10 bg-zinc-50 dark:bg-zinc-900 text-xs ring-brand" />
                <button type="submit" class="px-3.5 py-2 rounded-xl bg-brand text-white text-xs font-semibold hover:opacity-90 shrink-0">إضافة</button>

            </form>

          <!-- Inspiration Links -->
          <div class="bg-white dark:bg-[#141416] border border-black/[0.07] dark:border-white/10 rounded-3xl p-5 shadow-apple-sm flex flex-col">

            <div class="space-y-2.5 flex-1 mb-4">
              ${(mb.links || []).length === 0 ? `<p class="text-xs text-zinc-400 py-6 text-center">لم تُضف روابط إلهام بعد</p>` : (mb.links || []).map((l) => `
                <div class="flex items-center justify-between gap-2 p-3 rounded-2xl bg-zinc-50 dark:bg-zinc-900/70 border border-black/5 dark:border-white/5">
                  <a href="${escapeHtml(l.url)}" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 min-w-0 text-xs font-medium text-zinc-800 dark:text-zinc-200 hover:underline">
                    <span class="text-zinc-400 shrink-0">${Icons.external}</span>
                    <span class="truncate">${escapeHtml(l.title || l.url)}</span>
                  </a>
                  <button data-action="del-mb-link" data-id="${l.id}" class="p-1.5 rounded-xl text-zinc-400 hover:text-red-600 transition shrink-0">${Icons.trash}</button>
                </div>
              `).join("")}
            </div>
            <form id="add-mb-link-form" class="space-y-2 pt-3 border-t border-black/5 dark:border-white/10">
              <input name="title" type="text" required placeholder="عنوان المرجع" class="w-full px-3 py-2 rounded-xl border border-black/10 dark:border-white/10 bg-zinc-50 dark:bg-zinc-900 text-xs ring-brand" />
              <div class="flex gap-2">
                <input name="url" type="url" required placeholder="https://..." dir="ltr" class="flex-1 px-3 py-2 rounded-xl border border-black/10 dark:border-white/10 bg-zinc-50 dark:bg-zinc-900 text-xs text-left ring-brand" />

              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderChecklistTab(p) {
      const list = p.checklist || [];
      const done = list.filter((t) => t.done).length;
      const pct = list.length ? Math.round((done / list.length) * 100) : 0;

      return `
        <div class="max-w-3xl bg-white dark:bg-[#141416] border border-black/[0.07] dark:border-white/10 rounded-3xl p-6 shadow-apple-sm space-y-5">
          <div>
            <div class="flex items-center justify-between text-xs font-medium mb-2">
              <span class="text-zinc-600 dark:text-zinc-300">نسبة إنجاز المشروع</span>
              <span class="font-semibold">${pct}%</span>
            </div>
            <div class="h-2 rounded-full bg-zinc-100 dark:bg-zinc-800 overflow-hidden">
              <div class="h-full bg-brand rounded-full transition-all duration-300" style="width:${pct}%"></div>
            </div>
          </div>

          <form id="add-task-form" class="flex gap-2">
            <input name="text" type="text" required placeholder="أضف مهمة جديدة لتنظيم خطوات العمل..." class="flex-1 px-4 py-3 rounded-2xl border border-black/10 dark:border-white/10 bg-zinc-50 dark:bg-zinc-900 text-sm ring-brand" />
            <button type="submit" class="px-5 py-3 rounded-2xl bg-brand text-white text-xs font-semibold hover:opacity-90 shrink-0">إضافة مهمة</button>
          </form>

          <div class="space-y-2">
            ${list.length === 0 ? `<p class="text-xs text-zinc-400 text-center py-8">لا توجد مهام حالياً، ابدأ بإضافة أول خطوة</p>` : list.map((t) => `
              <div class="flex items-center justify-between gap-3 p-3.5 rounded-2xl bg-zinc-50/80 dark:bg-zinc-900/60 border border-black/5 dark:border-white/5">
                <button data-action="toggle-task" data-id="${t.id}" class="flex items-center gap-3 text-right flex-1 min-w-0">
                  <span class="w-5 h-5 rounded-lg border flex items-center justify-center shrink-0 transition ${t.done ? "bg-brand border-brand text-white" : "border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900"}">
                    ${t.done ? Icons.check : ""}
                  </span>
                  <span class="text-sm truncate ${t.done ? "line-through text-zinc-400" : "text-zinc-800 dark:text-zinc-100"}">${escapeHtml(t.text)}</span>
                </button>
                <button data-action="del-task" data-id="${t.id}" class="p-1.5 rounded-xl text-zinc-400 hover:text-red-600 transition shrink-0">${Icons.trash}</button>
              </div>
            `).join("")}
          </div>
        </div>
      `;

    function renderVaultTab(p) {
      const items = p.vault || [];
      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
          <div class="lg:col-span-7 bg-white dark:bg-[#141416] border border-black/[0.07] dark:border-white/10 rounded-3xl p-6 shadow-apple-sm">
            <h3 class="text-sm font-semibold mb-4">الملفات والعقود المرفقة</h3>
            <div class="space-y-2.5">
              ${items.length === 0 ? `<p class="text-xs text-zinc-400 text-center py-10">الخزنة فارغة حالياً</p>` : items.map((item) => {
                const cat = VAULT_CATEGORIES.find((c) => c.id === item.category) || VAULT_CATEGORIES[0];
                const isFinal = item.category === "final";
                return `
                  <div class="flex items-center justify-between gap-3 p-3.5 rounded-2xl border ${isFinal ? "bg-emerald-50/60 dark:bg-emerald-950/25 border-emerald-200/70 dark:border-emerald-900/50" : "bg-zinc-50/80 dark:bg-zinc-900/60 border-black/5 dark:border-white/5"}">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-9 h-9 rounded-xl bg-white dark:bg-zinc-800 border border-black/5 dark:border-white/10 flex items-center justify-center shrink-0 text-zinc-600 dark:text-zinc-300">
                        ${Icons.file}
                      </div>
                      <div class="min-w-0">
                        <div class="flex items-center gap-2">
                          <span class="text-sm font-medium truncate">${escapeHtml(item.title)}</span>
                          <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${isFinal ? "bg-emerald-500 text-white" : "bg-zinc-200 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300"}">${cat.label}</span>
                        </div>
                        <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="text-[11px] text-zinc-500 hover:underline truncate block mt-0.5" dir="ltr">${escapeHtml(item.url)}</a>
                      </div>
                    </div>
                    <button data-action="del-vault" data-id="${item.id}" class="p-2 rounded-xl text-zinc-400 hover:text-red-600 transition shrink-0">${Icons.trash}</button>
                  </div>
                `;
              }).join("")}
            </div>
          </div>

          <div class="lg:col-span-5 bg-white dark:bg-[#141416] border border-black/[0.07] dark:border-white/10 rounded-3xl p-6 shadow-apple-sm h-fit">
            <h3 class="text-sm font-semibold mb-1">إضافة ملف أو رابط للخزنة</h3>
            <p class="text-xs text-zinc-500 dark:text-zinc-400 mb-4">العقود والبريف والفواتير تظهر للعميل مباشرة، أما «ملفات نهائية» فتظهر له فور اعتماده للتصميم.</p>
            <form id="add-vault-form" class="space-y-3.5">
              <div>
                <label class="block text-xs font-medium text-zinc-600 dark:text-zinc-400 mb-1.5">التصنيف</label>
                <select name="category" class="w-full px-3.5 py-2.5 rounded-xl border border-black/10 dark:border-white/10 bg-zinc-50 dark:bg-zinc-900 text-xs ring-brand">
                  ${VAULT_CATEGORIES.map((c) => `<option value="${c.id}">${c.label}</option>`).join("")}
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-zinc-600 dark:text-zinc-400 mb-1.5">اسم الملف</label>
                <input name="title" type="text" required placeholder="مثال: عقد التصميم المعتمد.pdf" class="w-full px-3.5 py-2.5 rounded-xl border border-black/10 dark:border-white/10 bg-zinc-50 dark:bg-zinc-900 text-xs ring-brand" />
              </div>
              <div>
                <label class="block text-xs font-medium text-zinc-600 dark:text-zinc-400 mb-1.5">رابط الملف (Drive / Dropbox / PDF)</label>
                <input name="url" type="url" required placeholder="https://..." dir="ltr" class="w-full px-3.5 py-2.5 rounded-xl border border-black/10 dark:border-white/10 bg-zinc-50 dark:bg-zinc-900 text-xs text-left ring-brand" />
              </div>
              <button type="submit" class="w-full py-2.5 rounded-xl bg-brand text-white text-xs font-semibold hover:opacity-90 transition">حفظ في الخزنة</button>
            </form>
          </div>
        </div>
      `;
    }

    function renderDraftsTab(p) {
      const drafts = p.drafts || [];
      if (state.activeDraftIndex >= drafts.length) state.activeDraftIndex = Math.max(0, drafts.length - 1);
      const current = drafts[state.activeDraftIndex];

      return `
        <div class="space-y-5">
          <!-- Controls Bar -->
          <div class="flex flex-wrap items-center justify-between gap-3 bg-white dark:bg-[#141416] border border-black/[0.07] dark:border-white/10 rounded-3xl p-4 shadow-apple-sm">
            <div class="flex flex-wrap items-center gap-2">
              ${drafts.map((d, idx) => `
                <button data-action="select-draft" data-index="${idx}" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition ${idx === state.activeDraftIndex ? "bg-brand text-white" : "bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300"}">
                  ${escapeHtml(d.versionName)}
                </button>
              `).join("")}
              <button data-action="open-add-draft" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl border border-dashed border-black/20 dark:border-white/20 text-xs font-medium hover:border-brand transition">
                ${Icons.plus}
                <span>رفع نسخة جديدة</span>
              </button>
            </div>

            <div class="flex items-center gap-2 text-xs">
              <span class="text-zinc-500">عدّاد التعديلات:</span>
              <div class="flex items-center gap-1 bg-zinc-100 dark:bg-zinc-900 px-2 py-1 rounded-xl">
                <button data-action="adj-revisions" data-delta="-1" class="w-6 h-6 rounded-lg hover:bg-white dark:hover:bg-zinc-800 font-bold">-</button>
                <span class="px-2 font-semibold">${p.usedRevisions || 0} / ${p.maxRevisions || 3}</span>
                <button data-action="adj-revisions" data-delta="1" class="w-6 h-6 rounded-lg hover:bg-white dark:hover:bg-zinc-800 font-bold">+</button>
              </div>
            </div>
          </div>

          ${!current ? `
            <div class="bg-white dark:bg-[#141416] border border-dashed border-black/15 dark:border-white/15 rounded-3xl p-12 text-center">
              <p class="text-sm font-medium mb-2">لا توجد مسودات مرفوعة بعد</p>
              <p class="text-xs text-zinc-500 mb-5">ارفع النسخة الأولى من التصميم ليتمكن عميلك من استعراضها وترك ملاحظاته مباشرة عليها.</p>
              <button data-action="open-add-draft" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-brand text-white text-xs font-semibold hover:opacity-90">
                ${Icons.upload}
                <span>رفع المسودة الأولى</span>
              </button>
            </div>
          ` : `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <!-- Draft Image with Pins -->
              <div class="lg:col-span-8 bg-white dark:bg-[#141416] border border-black/[0.07] dark:border-white/10 rounded-3xl p-4 shadow-apple-sm">
                <div class="relative rounded-2xl overflow-hidden bg-zinc-100 dark:bg-zinc-900">
                  <img src="${escapeHtml(current.imageUrl)}" alt="${escapeHtml(current.versionName)}" class="w-full h-auto block select-none" onerror="this.src='https://placehold.co/1200x750/e4e4e7/52525b?text=Draft+Image'" />
                  ${(current.comments || []).map((c, i) => typeof c.x === "number" ? `
                    <button data-action="highlight-pin" data-comment="${c.id}" style="left:${c.x}%; top:${c.y}%;" class="absolute -translate-x-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-brand text-white text-[11px] font-bold flex items-center justify-center shadow-apple-md ring-2 ring-white dark:ring-zinc-900 transition hover:scale-110 ${state.highlightedCommentId === c.id ? "pin-highlight" : ""}" title="${escapeHtml(c.text)}">
                      ${i + 1}
                    </button>
                  ` : "").join("")}
                </div>
              </div>

              <!-- Client Comments List -->
              <div class="lg:col-span-4 bg-white dark:bg-[#141416] border border-black/[0.07] dark:border-white/10 rounded-3xl p-5 shadow-apple-sm flex flex-col">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="text-sm font-semibold">ملاحظات العميل (${(current.comments || []).length})</h3>
                  <button data-action="del-draft" data-id="${current.id}" class="text-[11px] text-zinc-400 hover:text-red-600 transition">حذف النسخة</button>
                </div>
                <div class="space-y-2.5 flex-1 max-h-[460px] overflow-y-auto">
                  ${(current.comments || []).length === 0 ? `
                    <p class="text-xs text-zinc-400 text-center py-10">لم يترك العميل أي ملاحظات على هذه النسخة بعد</p>
                  ` : (current.comments || []).map((c, i) => `
                    <div data-action="highlight-pin" data-comment="${c.id}" class="cursor-pointer p-3.5 rounded-2xl border transition ${state.highlightedCommentId === c.id ? "border-brand bg-zinc-50 dark:bg-zinc-900" : "border-black/5 dark:border-white/5 bg-zinc-50/60 dark:bg-zinc-900/50 hover:border-black/15"}">
                      <div class="flex items-center justify-between mb-1.5">
                        <span class="inline-flex items-center gap-1.5 text-[11px] font-semibold">
                          ${typeof c.x === "number" ? `<span class="w-5 h-5 rounded-full bg-brand text-white text-[10px] flex items-center justify-center">${i + 1}</span>` : Icons.pin}
                          <span>${escapeHtml(c.author || "العميل")}</span>
                        </span>
                        <span class="text-[10px] text-zinc-400">${formatDate(c.createdAt)}</span>
                      </div>
                      <p class="text-xs text-zinc-700 dark:text-zinc-300 leading-relaxed">${escapeHtml(c.text)}</p>
                    </div>
                  `).join("")}
                </div>
              </div>
            </div>
          `}
        </div>
      `;
    }

        return `
          <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
            <div class="w-14 h-14 rounded-2xl bg-zinc-100 dark:bg-zinc-900 flex items-center justify-center mb-4">${Icons.logo}</div>
            <h1 class="text-xl font-semibold mb-2">تعذر العثور على رابط المشروع</h1>
            <p class="text-sm text-zinc-500 max-w-sm mb-6">تأكد من صحة الرابط المرسل من المصمم، أو تواصل معه للحصول على الرابط المحدّث.</p>
            ${state.currentUser ? `<button data-action="exit-client-preview" class="px-5 py-2.5 rounded-2xl bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 text-xs font-semibold">العودة للاستوديو</button>` : ""}
          </div>

      const owner = state.users.find((u) => u.id === p.ownerId) || {};
      const studioName = owner.studioName || owner.name || "استوديو التصميم";
      const studioLogo = owner.studioLogo || "";
      applyBrandColor(owner.brandColor || "#18181B");

      const currentStageIdx = Math.max(0, STAGES.findIndex((s) => s.id === (p.isApproved ? "completed" : p.stage)));
      const vaultRegular = (p.vault || []).filter((v) => v.category !== "final");
      const vaultFinals = (p.vault || []).filter((v) => v.category === "final");
      const drafts = p.drafts || [];
      if (state.activeDraftIndex >= drafts.length) state.activeDraftIndex = Math.max(0, drafts.length - 1);
      const currentDraft = drafts[state.activeDraftIndex];

      const usedRev = p.usedRevisions || 0;
      const maxRev = p.maxRevisions || 3;
      const limitReached = usedRev >= maxRev;
      const canComment = !p.isApproved && !limitReached;

      return `
        <div class="min-h-screen pb-16">
          <!-- Designer-Branded Top Header -->
          <header class="sticky top-0 z-30 glass-nav border-b border-black/[0.06] dark:border-white/[0.08]">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
              <div class="flex items-center gap-3 min-w-0">
                <div class="w-9 h-9 rounded-2xl bg-brand text-white flex items-center justify-center overflow-hidden shrink-0 shadow-apple-sm">
                  ${studioLogo ? `<img src="${escapeHtml(studioLogo)}" alt="logo" class="w-full h-full object-cover" />` : Icons.logo}
                </div>
                <div class="min-w-0">
                  <div class="text-sm font-semibold truncate">${escapeHtml(studioName)}</div>
                  <div class="text-[11px] text-zinc-500">بوابة متابعة المشروع</div>
                </div>
              </div>

              <div class="flex items-center gap-2">
                ${state.previewingClient ? `
                  <button data-action="exit-client-preview" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 text-xs font-semibold hover:opacity-90 transition">

                    <span>العودة للاستوديو</span>
                  </button>
                ` : ""}
                <button data-action="toggle-theme" class="p-2.5 rounded-xl text-zinc-500 hover:bg-black/5 dark:hover:bg-white/10 transition">
                  ${state.theme === "dark" ? Icons.sun : Icons.moon}

              </div>
            </div>
          </header>

          <main class="max-w-6xl mx-auto px-4 sm:px-6 pt-8 space-y-7 animate-fade-up">

                <div>
                  <span class="inline-flex items-center gap-1.5 text-xs font-medium text-zinc-500 mb-1.5">

                      ${Icons.sparkle}
                      <span>اعتماد التصميم</span>
                    </button>

              </div>

                  const done = idx <= currentStageIdx;
                  const active = idx === currentStageIdx;

                    <div class="space-y-2">
                      <div class="h-1.5 rounded-full transition-all ${done ? "bg-brand" : "bg-zinc-200 dark:bg-zinc-800"}"></div>

                ` : `
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

                          <span class="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center shrink-0">${Icons.download}</span>

                        </div>
                        <span class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 shrink-0">تحميل</span>
                      </a>
                    `).join("")}

              </section>

                    ${canComment ? "اضغط على أي نقطة داخل صورة التصميم لترك ملاحظة محددة، أو اكتب ملاحظة عامة بالأسفل" : p.isApproved ? "تم إغلاق التعديلات بعد اعتماد التصميم" : "لقد استنفدت عدد التعديلات المشمولة في الباقة"}

                      ${escapeHtml(d.versionName)}

                <div class="py-14 text-center text-xs text-zinc-400 border border-dashed border-black/10 dark:border-white/10 rounded-2xl">

    // =========================================================================
    // 11. CENTRALIZED EVENT DELEGATION (ZERO INLINE HANDLERS, ZERO ERRORS)
    // =========================================================================
    async function addClientComment(text, pinCoords = null) {
      const p = state.projects.find((item) => item.id === state.clientProjectId);
      if (!p || p.isApproved) return;
      const used = p.usedRevisions || 0;
      const max = p.maxRevisions || 3;
      if (used >= max) {
        showToast("تم الوصول للحد الأقصى من التعديلات المشمولة", "error");
        return;
      }

      const drafts = (p.drafts || []).map((d, idx) => {
        if (idx !== state.activeDraftIndex) return d;
        const newComment = {
          id: genId("cmt"),
          author: p.clientName || "العميل",
          text: text.trim(),
          createdAt: Date.now()
        };
        if (pinCoords) {
          newComment.x = pinCoords.x;
          newComment.y = pinCoords.y;
        }
        return { ...d, comments: [...(d.comments || []), newComment] };
      });

      await Store.updateProject(p.id, {
        drafts,
        usedRevisions: used + 1,
        stage: "revisions",
        updatedAt: Date.now()
      });

      state.pendingPin = null;
      showToast("تم إرسال ملاحظتك للمصمم بنجاح", "success");
      render();
    }

    // CLICK DELEGATION
    document.addEventListener("click", async (e) => {
      // Close modal on backdrop click
      if (e.target && e.target.id === "modal-root") {
        closeModal();
        return;
      }

      // Click directly on Client Draft Canvas to drop a Figma-style pin
      const canvas = e.target.closest("#client-draft-canvas");
      if (canvas && !e.target.closest("[data-action]") && canvas.dataset.canPin === "1") {
        const rect = canvas.getBoundingClientRect();
        const x = Math.max(2, Math.min(98, Number((((e.clientX - rect.left) / rect.width) * 100).toFixed(1))));
        const y = Math.max(2, Math.min(98, Number((((e.clientY - rect.top) / rect.height) * 100).toFixed(1))));
        state.pendingPin = { x, y };
        render();
        return;
      }

      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const action = btn.dataset.action;

      try {
        switch (action) {
          case "close-modal":
            closeModal();
            break;

          case "toggle-theme":
            applyTheme(state.theme === "dark" ? "light" : "dark");
            render();
            break;

          case "auth-tab":
            state.authTab = btn.dataset.tab;
            render();
            break;

          case "logout":
            SafeStorage.remove(SESSION_USER_KEY);
            state.currentUser = null;
            state.activeProjectId = null;
            state.view = "auth";
            if (state.timer.intervalId) clearInterval(state.timer.intervalId);
            state.timer.running = false;
            render();
            break;

          case "nav":
            state.view = btn.dataset.view;
            state.previewingClient = false;
            render();
            break;

          case "open-new-project":
            openNewProjectModal();
            break;

          case "open-project":
            state.activeProjectId = btn.dataset.id;
            state.activeProjectTab = "moodboard";
            state.activeDraftIndex = 0;
            state.highlightedCommentId = null;
            state.view = "project";
            render();
            break;

          case "project-tab":
            state.activeProjectTab = btn.dataset.tab;
            render();
            break;

          case "copy-client-link":
            copyText(getClientShareUrl(btn.dataset.id), "تم نسخ رابط بوابة العميل الخاص");
            break;

          case "copy-text":
            copyText(btn.dataset.text, btn.dataset.msg || "تم النسخ");
            break;

          case "preview-client":
            state.clientProjectId = btn.dataset.id;
            state.previewingClient = true;
            state.activeDraftIndex = 0;
            state.pendingPin = null;
            state.view = "client";
            render();
            break;

          case "exit-client-preview":
            if (window.location.hash.startsWith("#client=")) {
              history.replaceState(null, "", window.location.pathname + window.location.search);
            }
            state.previewingClient = false;
            state.view = state.activeProjectId ? "project" : "board";
            render();
            break;

          case "delete-project": {
            const id = btn.dataset.id;
            openConfirmModal({
              title: "حذف المشروع نهائياً",
              message: "هل أنت متأكد من حذف هذا المشروع وكافة مسوداته وملفاته؟ لا يمكن التراجع عن هذا الإجراء.",
              confirmLabel: "حذف المشروع",
              danger: true,
              onConfirm: async () => {
                await Store.deleteProject(id);
                state.activeProjectId = null;
                state.view = "board";
                showToast("تم حذف المشروع", "success");
                render();
              }
            });
            break;
          }

          // Moodboard deletions
          case "del-mb-color":
          case "del-mb-font":
          case "del-mb-link": {
            const p = state.projects.find((x) => x.id === state.activeProjectId);
            if (!p) break;
            const key = action === "del-mb-color" ? "colors" : action === "del-mb-font" ? "fonts" : "links";
            const mb = { ...(p.moodboard || { links: [], colors: [], fonts: [] }) };
            mb[key] = (mb[key] || []).filter((item) => item.id !== btn.dataset.id);
            await Store.updateProject(p.id, { moodboard: mb, updatedAt: Date.now() });
            render();
            break;
          }

          // Checklist actions
          case "toggle-task": {
            const p = state.projects.find((x) => x.id === state.activeProjectId);
            if (!p) break;
            const checklist = (p.checklist || []).map((t) => t.id === btn.dataset.id ? { ...t, done: !t.done } : t);
            await Store.updateProject(p.id, { checklist, updatedAt: Date.now() });
            render();
            break;
          }
          case "del-task": {
            const p = state.projects.find((x) => x.id === state.activeProjectId);
            if (!p) break;
            const checklist = (p.checklist || []).filter((t) => t.id !== btn.dataset.id);
            await Store.updateProject(p.id, { checklist, updatedAt: Date.now() });
            render();
            break;
          }

          // Vault deletion
          case "del-vault": {
            const p = state.projects.find((x) => x.id === state.activeProjectId);
            if (!p) break;
            const vault = (p.vault || []).filter((v) => v.id !== btn.dataset.id);
            await Store.updateProject(p.id, { vault, updatedAt: Date.now() });
            showToast("تم حذف الملف من الخزنة", "success");
            render();
            break;
          }

          // Drafts actions
          case "select-draft":
            state.activeDraftIndex = parseInt(btn.dataset.index, 10) || 0;
            state.pendingPin = null;
            state.highlightedCommentId = null;
            render();
            break;

          case "open-add-draft":
            openAddDraftModal();
            break;

          case "del-draft": {
            const p = state.projects.find((x) => x.id === state.activeProjectId);
            if (!p) break;
            const drafts = (p.drafts || []).filter((d) => d.id !== btn.dataset.id);
            await Store.updateProject(p.id, { drafts, updatedAt: Date.now() });
            state.activeDraftIndex = 0;
            showToast("تم حذف النسخة", "success");
            render();
            break;
          }

          case "adj-revisions": {
            const p = state.projects.find((x) => x.id === state.activeProjectId);
            if (!p) break;
            const delta = parseInt(btn.dataset.delta, 10) || 0;
            const next = Math.max(0, Math.min(p.maxRevisions || 3, (p.usedRevisions || 0) + delta));
            await Store.updateProject(p.id, { usedRevisions: next, updatedAt: Date.now() });
            render();
            break;
          }

          case "highlight-pin":
            state.highlightedCommentId = btn.dataset.comment;
            render();
            break;

          case "cancel-pin":
            state.pendingPin = null;
            render();
            break;

          // Client Official Approval
          case "client-approve": {
            const p = state.projects.find((x) => x.id === state.clientProjectId);
            if (!p) break;
            openConfirmModal({
              title: "اعتماد التصميم رسمياً",
              message: "بضغطك على تأكيد، سيتم إغلاق التعديلات واعتماد النسخة الحالية كتصميم نهائي، وستظهر لك خانة تحميل الملفات النهائية مباشرة.",
              confirmLabel: "تأكيد الاعتماد",
              onConfirm: async () => {
                await Store.updateProject(p.id, {
                  isApproved: true,
                  approvedAt: Date.now(),
                  stage: "completed",
                  updatedAt: Date.now()
                });
                state.pendingPin = null;
                showToast("مبارك! تم اعتماد التصميم وفتح الملفات النهائية", "success");
                render();
              }
            });
            break;
          }

          // Settings Swatch Picker
          case "pick-swatch": {
            const hex = btn.dataset.hex;
            const input = document.getElementById("settings-brand-color");
            if (input) input.value = hex;
            applyBrandColor(hex);
            break;
          }

          // Admin Actions
          case "gen-random-code": {
            const code = generateActivationCode();
            await Store.addCode({
              code,
              status: "available",
              usedByEmail: null,
              usedAt: null,
              createdAt: Date.now()
            });
            copyText(code, `تم إصدار ونسخ الكود: ${code}`);
            render();
            break;
          }

          case "del-code":
            await Store.deleteCode(btn.dataset.id);
            showToast("تم حذف الكود", "success");
            render();
            break;

          case "toggle-user-status": {
            const approve = btn.dataset.next === "approve";
            await Store.updateUser(btn.dataset.id, {
              isActive: approve,
              status: approve ? "active" : "suspended"
            });
            showToast(approve ? "تم تفعيل حساب المصمم بنجاح" : "تم إيقاف الحساب", "success");
            render();
            break;
          }

          // Focus Timer Controls
          case "timer-toggle-expand":
            state.timer.expanded = !state.timer.expanded;
            renderFocusTimer();
            break;

          case "timer-preset":
            setFocusPreset(parseInt(btn.dataset.mins, 10) || 25);
            break;

          case "timer-play-pause":
            toggleFocusTimer();
            break;

          case "timer-reset":
            setFocusPreset(state.timer.presetMinutes);
            break;
        }
      } catch (err) {
        console.error("Action error:", err);
        showToast("حدث خطأ غير متوقع، حاول مرة أخرى", "error");
      }
    });

    // CHANGE DELEGATION (Stage select, Color picker, Logo file upload)
    document.addEventListener("change", async (e) => {
      const target = e.target;
      if (!target) return;

      if (target.dataset.action === "change-stage") {
        await Store.updateProject(target.dataset.id, { stage: target.value, updatedAt: Date.now() });
        showToast("تم تحديث مرحلة المشروع", "success");
        render();
        return;
      }

      if (target.id === "settings-brand-color") {
        applyBrandColor(target.value);
        return;
      }

      if (target.id === "settings-logo-file") {
        const file = target.files?.[0];
        if (!file) return;
        try {
          const dataUrl = await compressImageFile(file, 320, 0.85);
          const urlInput = document.getElementById("settings-logo-url");
          if (urlInput) urlInput.value = dataUrl;
          showToast("تم تجهيز الشعار، اضغط «حفظ الهوية» للاعتماد", "success");
        } catch (err) {
          showToast(err.message, "error");
        }
      }
    });

    // SUBMIT DELEGATION (All forms handled cleanly in one place)
    document.addEventListener("submit", async (e) => {
      const form = e.target;
      if (!form || !form.id) return;

      // Modal forms attach their own listeners directly
      if (form.id === "new-project-form" || form.id === "add-draft-form") return;

      e.preventDefault();
      const fd = new FormData(form);

      try {
        // 1. Auth Form (Login & Signup)
        if (form.id === "auth-form") {
          const email = (fd.get("email") || "").trim().toLowerCase();
          const password = fd.get("password") || "";
          const name = (fd.get("name") || "").trim();
          const pwdHash = await hashPassword(password);
          const admin = isAdminEmail(email);

          if (state.authTab === "signup") {
            if (!name) { showToast("يرجى إدخال الاسم أو اسم الاستوديو", "error"); return; }
            if (state.users.some((u) => (u.email || "").toLowerCase() === email)) {
              showToast("هذا البريد الإلكتروني مسجل مسبقاً", "error");
              return;
            }
            const uid = genId("usr");
            const newUser = {
              email,
              name,
              passwordHash: pwdHash,
              role: admin ? "admin" : "designer",
              isActive: admin,
              status: admin ? "active" : "pending",
              studioName: name,
              studioLogo: "",
              brandColor: "#18181B",
              focusSessionsToday: 0,
              focusDate: new Date().toISOString().slice(0, 10),
              hasSeededSamples: false,
              createdAt: Date.now()
            };
            await Store.setUser(uid, newUser);
            state.currentUser = { id: uid, ...newUser };
            SafeStorage.set(SESSION_USER_KEY, uid);

            if (newUser.isActive) {
              state.view = "board";
              showToast("مرحباً بكِ! تم تفعيل حساب الإدارة الرسمي", "success");
              await ensureSampleProjects(state.currentUser);
            } else {
              state.view = "pending";
              showToast("تم إنشاء حسابك، بانتظار التفعيل", "success");
            }
            render();
            return;
          } else {
            let found = state.users.find((u) => (u.email || "").toLowerCase() === email);
            if (!found) {
              // Convenient auto-create for Admin if logging in for first time
              if (admin) {
                const uid = genId("usr");
                const adminUser = {
                  email,
                  name: "الإدارة",
                  passwordHash: pwdHash,
                  role: "admin",
                  isActive: true,
                  status: "active",
                  studioName: "استوديو الإدارة",
                  studioLogo: "",
                  brandColor: "#18181B",
                  focusSessionsToday: 0,
                  focusDate: new Date().toISOString().slice(0, 10),
                  hasSeededSamples: false,
                  createdAt: Date.now()
                };
                await Store.setUser(uid, adminUser);
                found = { id: uid, ...adminUser };
              } else {
                showToast("البريد الإلكتروني غير مسجل، يمكنك إنشاء حساب جديد", "error");
                return;
              }
            } else if (found.passwordHash !== pwdHash) {
              showToast("كلمة المرور غير صحيحة", "error");
              return;
            }

            if (admin && (!found.isActive || found.role !== "admin")) {
              await Store.updateUser(found.id, { role: "admin", isActive: true, status: "active" });
              found = { ...found, role: "admin", isActive: true, status: "active" };
            }

            state.currentUser = found;
            SafeStorage.set(SESSION_USER_KEY, found.id);
            if (found.isActive) {
              state.view = "board";
              showToast(`أهلاً بعودتك، ${found.name}`, "success");
              await ensureSampleProjects(found);
            } else {
              state.view = "pending";
            }
            render();
            return;
          }
        }

        // 2. Redeem Activation Code
        if (form.id === "redeem-code-form") {
          const codeStr = (fd.get("code") || "").trim().toUpperCase();
          const codeDoc = state.codes.find((c) => c.code.toUpperCase() === codeStr);
          if (!codeDoc) { showToast("كود التفعيل غير صحيح", "error"); return; }
          if (codeDoc.status === "used") { showToast("هذا الكود مستخدم مسبقاً", "error"); return; }

          await Store.updateCode(codeDoc.id, {
            status: "used",
            usedByEmail: state.currentUser.email,
            usedAt: Date.now()
          });
          await Store.updateUser(state.currentUser.id, {
            isActive: true,
            status: "active",
            activatedByCode: codeStr
          });
          state.view = "board";
          showToast("تم تفعيل حسابك مدى الحياة بنجاح!", "success");
          await ensureSampleProjects(state.currentUser);
          render();
          return;
        }

        // 3. Studio Settings
        if (form.id === "settings-form") {
          const studioName = (fd.get("studioName") || "").trim();
          const studioLogo = (fd.get("studioLogo") || "").trim();
          const brandColor = fd.get("brandColor") || "#18181B";
          await Store.updateUser(state.currentUser.id, { studioName, studioLogo, brandColor });
          applyBrandColor(brandColor);
          showToast("تم حفظ هوية الاستوديو بنجاح", "success");
          render();
          return;
        }

        // 4. Admin Custom Activation Code
        if (form.id === "custom-code-form") {
          const cleaned = (fd.get("code") || "").trim().toUpperCase().replace(/\s+/g, "-");
          const code = cleaned || generateActivationCode();
          if (state.codes.some((c) => c.code.toUpperCase() === code)) {
            showToast("هذا الكود موجود مسبقاً", "error");
            return;
          }
          await Store.addCode({ code, status: "available", usedByEmail: null, usedAt: null, createdAt: Date.now() });
          copyText(code, `تم إنشاء ونسخ الكود: ${code}`);
          render();
          return;
        }

        // 5. Moodboard & Workspace Forms
        const p = state.projects.find((x) => x.id === state.activeProjectId);
        if (form.id === "add-mb-color-form" && p) {
          const mb = { ...(p.moodboard || { links: [], colors: [], fonts: [] }) };
          mb.colors = [...(mb.colors || []), { id: genId("clr"), hex: fd.get("hex"), label: (fd.get("label") || "").trim() }];
          await Store.updateProject(p.id, { moodboard: mb, updatedAt: Date.now() });
          render();
          return;
        }
        if (form.id === "add-mb-font-form" && p) {
          const mb = { ...(p.moodboard || { links: [], colors: [], fonts: [] }) };
          mb.fonts = [...(mb.fonts || []), { id: genId("fnt"), name: fd.get("name").trim(), note: (fd.get("note") || "").trim() }];
          await Store.updateProject(p.id, { moodboard: mb, updatedAt: Date.now() });
          render();
          return;
        }
        if (form.id === "add-mb-link-form" && p) {
          const mb = { ...(p.moodboard || { links: [], colors: [], fonts: [] }) };
          mb.links = [...(mb.links || []), { id: genId("lnk"), title: fd.get("title").trim(), url: fd.get("url").trim() }];
          await Store.updateProject(p.id, { moodboard: mb, updatedAt: Date.now() });
          render();
          return;
        }
        if (form.id === "add-task-form" && p) {
          const checklist = [...(p.checklist || []), { id: genId("tsk"), text: fd.get("text").trim(), done: false }];
          await Store.updateProject(p.id, { checklist, updatedAt: Date.now() });
          render();
          return;
        }
        if (form.id === "add-vault-form" && p) {
          const vault = [...(p.vault || []), {
            id: genId("vlt"),
            category: fd.get("category"),
            title: fd.get("title").trim(),
            url: fd.get("url").trim()
          }];
          await Store.updateProject(p.id, { vault, updatedAt: Date.now() });
          showToast("تمت الإضافة إلى خزنة الملفات", "success");
          render();
          return;
        }

        // 6. Client Portal Comments
        if (form.id === "client-pin-comment-form") {
          await addClientComment(fd.get("text"), state.pendingPin);
          return;
        }
        if (form.id === "client-general-comment-form") {
          await addClientComment(fd.get("text"), null);
          return;
        }
      } catch (err) {
        console.error("Form submit error:", err);
        showToast("حدث خطأ أثناء الحفظ", "error");
      }
    });

    // HTML5 DRAG & DROP DELEGATION FOR KANBAN BOARD
    document.addEventListener("dragstart", (e) => {
      const card = e.target.closest("[data-drag-project]");
      if (!card) return;
      state.draggedProjectId = card.dataset.dragProject;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", state.draggedProjectId);
      card.style.opacity = "0.5";
    });

    document.addEventListener("dragend", (e) => {
      const card = e.target.closest("[data-drag-project]");
      if (card) card.style.opacity = "1";
      document.querySelectorAll(".kanban-col-over").forEach((el) => el.classList.remove("kanban-col-over"));
    });

    document.addEventListener("dragover", (e) => {
      const col = e.target.closest("[data-drop-stage]");
      if (!col) return;
      e.preventDefault();
      col.classList.add("kanban-col-over");
    });

    document.addEventListener("dragleave", (e) => {
      const col = e.target.closest("[data-drop-stage]");
      if (col && !col.contains(e.relatedTarget)) {
        col.classList.remove("kanban-col-over");
      }
    });

    document.addEventListener("drop", async (e) => {
      const col = e.target.closest("[data-drop-stage]");
      if (!col) return;
      e.preventDefault();
      col.classList.remove("kanban-col-over");
      const stageId = col.dataset.dropStage;
      const projectId = state.draggedProjectId || e.dataTransfer.getData("text/plain");
      state.draggedProjectId = null;
      if (projectId && stageId) {
        await Store.updateProject(projectId, { stage: stageId, updatedAt: Date.now() });
        render();
      }
    });

    // ESCAPE KEY CLOSES MODAL
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    // =========================================================================
    // 12. BOOTSTRAP APPLICATION
    // =========================================================================
    async function boot() {
      applyTheme(state.theme);
      await Store.init();
      if (!checkHashRoute()) {
        render();
      }
    }

    boot();
  </script>
</body>
</html>
